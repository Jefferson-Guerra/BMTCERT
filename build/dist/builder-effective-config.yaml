directories:
  output: dist
  buildResources: build
appId: com.local.sslmanager
productName: SSL Manager
files:
  - filter:
      - '**/*'
asarUnpack:
  - data/**/*
icon: build/icon.ico
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
electronVersion: 31.7.7
